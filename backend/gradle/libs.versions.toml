[versions]
### java-common-conventions ###
java-version = "21"
junit-version = "5.12.2"
lombok-version = "9.1.0"
slf4j-version = "2.0.13"
logback-version = "1.5.6"

[libraries]
### java-common-conventions ###
lombok-plugin = { group = "io.freefair.lombok", name = "io.freefair.lombok.gradle.plugin", version.ref = "lombok-version" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-version" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j-version" }
logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "logback-version" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback-version" }

[plugins]
### java-common-conventions ###
lombok = { id = "io.freefair.lombok" }